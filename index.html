<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мини-игра: Змейка</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4ecca3;
        }
        canvas {
            border: 3px solid #4ecca3;
            background-color: #16213e;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.2);
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <h1>Змейка</h1>
    <div id="score-board">Счёт: <span id="score">0</span></div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls">Управление: стрелки на клавиатуре или W A S D</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const grid = 20;
        let count = 0;
        let score = 0;

        let snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [],
            maxCells: 4
        };

        let apple = {
            x: 320,
            y: 320
        };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function resetGame() {
            alert('Игра окончена! Ваш счёт: ' + score);
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            score = 0;
            scoreElement.textContent = score;
            apple.x = getRandomInt(0, 20) * grid;
            apple.y = getRandomInt(0, 20) * grid;
        }

        function loop() {
            requestAnimationFrame(loop);

            if (++count < 6) {
                return;
            }
            count = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            // Проход сквозь стены
            if (snake.x < 0) {
                snake.x = canvas.width - grid;
            } else if (snake.x >= canvas.width) {
                snake.x = 0;
            }

            if (snake.y < 0) {
                snake.y = canvas.height - grid;
            } else if (snake.y >= canvas.height) {
                snake.y = 0;
            }

            snake.cells.unshift({ x: snake.x, y: snake.y });

            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            // Рисуем яблоко
            ctx.fillStyle = '#e94560';
            ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            // Рисуем змейку
            ctx.fillStyle = '#4ecca3';
            snake.cells.forEach(function (cell, index) {
                ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

                // Если змейка съела яблоко
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10;
                    scoreElement.textContent = score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }

                // Проверка столкновения с хвостом
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        resetGame();
                    }
                }
            });
        }

        document.addEventListener('keydown', function (e) {
            // Стрелка влево или A
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') && snake.dx === 0) {
                snake.dx = -grid;
                snake.dy = 0;
            }
            // Стрелка вверх или W
            else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') && snake.dy === 0) {
                snake.dy = -grid;
                snake.dx = 0;
            }
            // Стрелка вправо или D
            else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') && snake.dx === 0) {
                snake.dx = grid;
                snake.dy = 0;
            }
            // Стрелка вниз или S
            else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') && snake.dy === 0) {
                snake.dy = grid;
                snake.dx = 0;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
