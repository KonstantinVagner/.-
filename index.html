<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACK RUSSIA 2D LITE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background: #1a1a1a;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Верхний HUD */
        #hud-top {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        .server-info {
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 12px;
            border-radius: 8px;
            border-left: 4px solid #e63946;
            font-size: 12px;
        }
        .server-title {
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }
        .server-title span { color: #e63946; }
        .stats-box {
            text-align: right;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 14px;
            border-radius: 8px;
        }
        #money {
            font-size: 20px;
            font-weight: bold;
            color: #4ecca3;
            font-family: monospace;
        }
        #stars {
            color: #ffb703;
            font-size: 16px;
            margin-top: 2px;
            letter-spacing: 2px;
        }
        /* Плашка задания (опущена ниже, чтобы не мешать) */
        #mission-banner {
            position: absolute;
            top: 78px;
            left: 15px;
            right: 15px;
            background: rgba(230, 57, 70, 0.92);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        /* Кнопки меню (опущены под плашку задания) */
        .menu-btns {
            position: absolute;
            top: 118px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 15;
        }
        .action-btn {
            background: rgba(20, 20, 30, 0.85);
            border: 1px solid #e63946;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Управление для телефона */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 15;
        }
        .ctrl-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 68px;
            height: 68px;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(230, 57, 70, 0.75);
            border-color: #fff;
            transform: scale(0.92);
        }
        .pedal-btn {
            width: 65px;
            height: 85px;
            border-radius: 14px;
            font-size: 14px;
        }
        .gas { border-color: #4ecca3; }
        .brake { border-color: #e63946; }

        /* Модальное окно Автосалона */
        #shop-modal {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 20, 0.96);
            z-index: 30;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e63946;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .car-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .car-card {
            background: #252530;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3a3a4a;
        }
        .car-info h4 { margin: 0 0 5px 0; font-size: 16px; }
        .car-info p { margin: 0; font-size: 12px; color: #aaa; }
        .buy-btn {
            background: #4ecca3;
            color: #111;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }
        .buy-btn:disabled {
            background: #555;
            color: #888;
        }
        #speedometer {
            position: absolute;
            bottom: 120px;
            right: 25px;
            font-size: 18px;
            font-weight: 900;
            color: rgba(255,255,255,0.9);
            text-shadow: 1px 1px 3px #000;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="hud-top">
        <div class="server-info">
            <div class="server-title">BLACK <span>RUSSIA</span> 2D</div>
            <div>Сервер: RED | Онлайн: 1000</div>
            <div id="car-name" style="color:#4ecca3; margin-top:2px;">ВАЗ 2107</div>
        </div>
        <div class="stats-box">
            <div id="money">5 000 ₽</div>
            <div id="stars">☆☆☆☆☆</div>
        </div>
    </div>

    <div id="mission-banner">Едьте на зелёную метку (Работа)</div>

    <div class="menu-btns">
        <button class="action-btn" onclick="openShop()">🚗 Автосалон</button>
        <button class="action-btn" onclick="bribePolice()">💸 Снять розыск (2000₽)</button>
    </div>

    <div id="speedometer"><span id="speed-val">0</span> км/ч</div>

    <div id="controls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn pedal-btn brake" id="btn-down">ТОРМОЗ</div>
            <div class="ctrl-btn pedal-btn gas" id="btn-up">ГАЗ</div>
        </div>
    </div>

    <!-- Автосалон -->
    <div id="shop-modal">
        <div class="shop-header">
            <h2 style="margin:0;">АВТОСАЛОН</h2>
            <button class="action-btn" onclick="closeShop()">Закрыть ✖</button>
        </div>
        <div class="car-list" id="car-list"></div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Безопасная загрузка сохранений (на случай блокировки localStorage в режиме просмотра)
        function loadStorage(key, fallback) {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? val : fallback;
            } catch (e) {
                return fallback;
            }
        }
        function saveStorage(key, val) {
            try {
                localStorage.setItem(key, val);
            } catch (e) {}
        }

        let money = parseInt(loadStorage('br_money', '5000'));
        let currentCarId = parseInt(loadStorage('br_car', '0'));
        let ownedCars = JSON.parse(loadStorage('br_owned', '[0]'));
        let wantedLevel = 0;

        const carsCatalog = [
            { id: 0, name: "ВАЗ 2107 (Классика)", price: 0, maxSpeed: 6, accel: 0.2, turn: 0.055, color: "#d90429" },
            { id: 1, name: "Lada Priora (Опер)", price: 15000, maxSpeed: 8, accel: 0.28, turn: 0.065, color: "#111111" },
            { id: 2, name: "BMW M5 F90", price: 50000, maxSpeed: 11, accel: 0.4, turn: 0.075, color: "#0077b6" },
            { id: 3, name: "Mercedes G63 AMG", price: 120000, maxSpeed: 10.5, accel: 0.38, turn: 0.06, color: "#2b2d42" },
            { id: 4, name: "Lamborghini Huracan", price: 300000, maxSpeed: 14, accel: 0.55, turn: 0.085, color: "#ffb703" }
        ];

        const WORLD_SIZE = 2400;
        const BLOCK_SIZE = 400;

        let player = {
            x: 1200,
            y: 1200,
            angle: -Math.PI / 2,
            speed: 0
        };

        const keys = { left: false, right: false, up: false, down: false };
        let jobMarker = { x: 1200, y: 800, reward: 2500 };

        let cops = [];
        let peds = [];
        let skidMarks = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function saveProgress() {
            saveStorage('br_money', money);
            saveStorage('br_car', currentCarId);
            saveStorage('br_owned', JSON.stringify(ownedCars));
            updateHUD();
        }

        function updateHUD() {
